[package]
name = "apy-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for DeFi lending rate aggregation across multiple chains"

[features]
default = ["mcp", "web"]
mcp = ["rmcp", "rmcp-macros", "schemars"]
web = ["rust-embed", "dioxus"]

[dependencies]
# MCP server (latest version with server_handler support)
rmcp = { version = "1.7", features = ["server", "transport-io", "transport-streamable-http-server", "server-side-http", "tower", "auth"], optional = true }
rmcp-macros = { version = "1.7", optional = true }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Futures combinators
futures = "0.3"

# HTTP server (axum)
axum = { version = "0.8", features = ["http1", "tokio"] }
tower = "0.5"
tower-service = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"
bytes = "1"

# HTTP client (rustls so the Linux release builds as a static musl binary
# that runs on any glibc version)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 encoding/decoding (for XDR)
base64 = "0.22"

# Stellar XDR types (for proper LedgerKey construction)
stellar-xdr = { version = "22", features = ["std"] }

# JSON Schema generation for MCP tool parameters
schemars = { version = "1", optional = true }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Chrono for timestamps
chrono = "0.4"

# Async trait
async-trait = "0.1"
stellar-strkey = "0.0.16"

# Primitive types for EVM addresses
primitive-types = "0.12"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Database (SQLite for API key storage)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid"] }

# UUID generation for API keys
uuid = { version = "1", features = ["v4"] }

# Rate limiting
governor = "0.8"

# Password hashing for admin tokens
sha2 = "0.10"
hex = "0.4"
# Keccak-256 for EIP-55 address checksumming (Trust Wallet stores token
# logos under the checksummed path, not the lowercase path we get from
# ABI decoding — so the icon proxy checksum-cases the address before
# hitting Trust Wallet).
sha3 = "0.10"

# URL encoding
urlencoding = "2"

# URL parsing
url = "2"

# Query-string deserialization for axum Query extractor (and tests)
serde_urlencoded = "0.7"

# Embed static frontend assets into the binary
rust-embed = { version = "8", optional = true }

# SSR frontend (web feature only)
dioxus = { version = "0.6", features = ["ssr"], optional = true }
