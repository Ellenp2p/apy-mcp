[package]
name = "apy-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for DeFi lending rate aggregation across multiple chains"

[dependencies]
# MCP server (latest version with server_handler support)
rmcp = { version = "1.7", features = ["server", "transport-io", "transport-streamable-http-server", "server-side-http", "tower"] }
rmcp-macros = "1.7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server (axum)
axum = { version = "0.8", features = ["http1", "tokio"] }
tower = "0.5"
tower-service = "0.3"
http-body-util = "0.1"
bytes = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 encoding/decoding (for XDR)
base64 = "0.22"

# Stellar XDR types (for proper LedgerKey construction)
stellar-xdr = { version = "22", features = ["std"] }

# JSON Schema generation for MCP tool parameters
schemars = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Chrono for timestamps
chrono = "0.4"

# Async trait
async-trait = "0.1"
stellar-strkey = "0.0.16"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Database (SQLite for API key storage)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid"] }

# UUID generation for API keys
uuid = { version = "1", features = ["v4"] }

# Rate limiting
governor = "0.8"

# Password hashing for admin tokens
sha2 = "0.10"
hex = "0.4"
